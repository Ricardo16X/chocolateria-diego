[www]
user = laravel
group = laravel
listen = 0.0.0.0:9000

; El punto de venta no puede quedarse sin proceso disponible durante una
; venta: se mantienen procesos arrancados en lugar de crearlos bajo demanda.
pm = static
pm.max_children = 8
pm.max_requests = 400
request_terminate_timeout = 45s

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
