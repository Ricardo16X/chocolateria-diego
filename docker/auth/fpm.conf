[www]
user = laravel
group = laravel
listen = 0.0.0.0:9000

; Peticiones cortas: muchos procesos livianos, reciclaje frecuente
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 300
request_terminate_timeout = 30s

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
