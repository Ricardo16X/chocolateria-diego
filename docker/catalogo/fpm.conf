[www]
user = laravel
group = laravel
listen = 0.0.0.0:9000

; Lecturas intensivas: mas procesos concurrentes
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500
request_terminate_timeout = 60s

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
