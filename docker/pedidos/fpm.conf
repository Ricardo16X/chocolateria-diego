[www]
user = laravel
group = laravel
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 400
; La carga de comprobantes puede tardar mas que una peticion normal
request_terminate_timeout = 90s

pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
clear_env = no
